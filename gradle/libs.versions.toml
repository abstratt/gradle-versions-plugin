[versions]
kotlin = "2.4.10"

[plugins]
dokka = { id = "org.jetbrains.dokka", version = "2.0.0" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "14.2.0" }
plugin-publish = { id = "com.gradle.plugin-publish", version = "2.2.1" }

[libraries]
# Versionless, so that it tracks the JUnit platform that Spock's own bom pins.
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
moshi = { module = "com.squareup.moshi:moshi-kotlin", version = "1.15.2" }
spock = { module = "org.spockframework:spock-junit4", version = "2.4-M4-groovy-4.0" }
